<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' ws: wss:;" />
<title>Yuza Support</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,sans-serif; background:#0b0c10; color:#e7e9ee;
         height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* --- écran login --- */
  #login { margin:auto; text-align:center; padding:24px; }
  #login h1 { margin:0 0 6px; font-size:22px; }
  #login p { color:#8b90a0; margin:0 0 18px; }
  button, a.btn { background:#5865F2; color:#fff; border:0; padding:10px 18px; border-radius:8px;
           font-size:14px; cursor:pointer; text-decoration:none; display:inline-block; }
  button:hover, a.btn:hover { background:#4752c4; }
  button:disabled { opacity:.5; cursor:default; }

  /* --- app --- */
  #app { display:none; flex:1; min-height:0; }
  #app.on { display:flex; }
  #sidebar { width:280px; border-right:1px solid #1e2128; flex-shrink:0; display:flex; flex-direction:column; }
  #sbHead { flex-shrink:0; padding:8px; border-bottom:1px solid #1e2128; display:flex; flex-direction:column; gap:6px; }
  #search { width:100%; background:#12141a; border:1px solid #262a33; color:#e7e9ee;
            padding:7px 10px; border-radius:7px; font:inherit; }
  #filters { display:flex; gap:4px; }
  #filters button { flex:1; background:#12141a; border:1px solid #262a33; color:#8b90a0;
                    padding:5px 0; border-radius:6px; font-size:12px; cursor:pointer; }
  #filters button:hover { background:#171a21; }
  #filters button.active { background:#2b3550; border-color:#3a4770; color:#e7e9ee; }
  #ticketList { flex:1; overflow-y:auto; }
  #ticketList .empty { color:#6b7080; padding:16px; font-size:13px; }
  .tk { padding:10px 12px; border-bottom:1px solid #15171d; cursor:pointer; }
  .tk:hover { background:#12141a; }
  .tk.active { background:#1a1d25; }
  .tk .n { font-weight:600; display:flex; justify-content:space-between; gap:6px; }
  .tk .p { color:#8b90a0; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .tk.closed .n { color:#6b7080; }
  .badge { background:#f04747; color:#fff; border-radius:10px; padding:0 6px; font-size:11px; line-height:16px; }
  .grp { padding:7px 12px; font-size:12px; font-weight:600; color:#9aa0b0; background:#0e1015;
         border-bottom:1px solid #15171d; border-top:1px solid #15171d; cursor:pointer; user-select:none; }
  .grp .arw { display:inline-block; width:12px; color:#6b7080; }
  .grp .cnt { color:#6b7080; font-weight:400; margin-left:4px; }
  .grp .gbadge { background:#f04747; color:#fff; border-radius:10px; padding:0 6px;
                 font-size:11px; line-height:16px; float:right; }

  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #head { padding:10px 14px; border-bottom:1px solid #1e2128; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  #head .sp { flex:1; }
  #head .who { color:#8b90a0; font-size:12px; }
  #catSelect, #escSelect { background:#12141a; border:1px solid #262a33; color:#e7e9ee;
               padding:5px 8px; border-radius:6px; font:inherit; font-size:12px; max-width:170px; }
  #catSelect.unset { color:#8b90a0; border-color:#3a3320; }
  #headAssignee { color:#c9a94e; font-size:12px; }
  #takeBtn.mine { background:#3a7d3a; }
  #takeBtn.mine:hover { background:#336b33; }
  .tk .lock { color:#c9a94e; font-size:11px; margin-top:2px; white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }
  .tk.assigned-other { opacity:.72; }
  #msgs { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .m { max-width:72%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .m.client { align-self:flex-start; background:#202430; }
  .m.staff  { align-self:flex-end;   background:#2b3550; }
  .m.system { align-self:center; background:transparent; color:#6b7080; font-size:12px; }
  .m.note { align-self:stretch; max-width:100%; background:#3a3320; border:1px solid #5c4d1f; color:#e8dfae; }
  .m.note .meta { color:#b7a45e; }
  .m.note::before { content:"📝 note interne — non envoyée au client"; display:block;
                    font-size:11px; color:#b7a45e; margin-bottom:4px; }
  .m .meta { font-size:11px; color:#8b90a0; margin-bottom:3px; }
  .m .att { display:block; max-width:260px; max-height:260px; border-radius:8px; margin-top:6px; }
  .m .attfile { display:inline-block; margin-top:6px; color:#8ab4ff; text-decoration:none;
                background:#00000030; padding:4px 8px; border-radius:6px; font-size:12px; }
  .tk.bl .n { color:#f0777c; }
  .tk .blmark { color:#f0777c; font-size:11px; margin-top:2px; }
  #blockBtn.on { background:#7d3a3a; }
  #composer { display:flex; gap:8px; padding:12px 14px; border-top:1px solid #1e2128; }
  #composer input { flex:1; background:#12141a; border:1px solid #262a33; color:#e7e9ee;
                    padding:10px 12px; border-radius:8px; font:inherit; }
  #composer button { flex-shrink:0; }
  #noteToggle { flex-shrink:0; display:flex; align-items:center; gap:5px; white-space:nowrap;
                color:#8b90a0; cursor:pointer; user-select:none; font-size:13px; }
  #noteToggle input { cursor:pointer; }
  #composer.note-mode input { border-color:#5c4d1f; background:#26210f; }
  #composer.note-mode #sendBtn { background:#8a7320; }
  #composer.note-mode #noteToggle { color:#d8c88a; }
  #status { font-size:12px; color:#8b90a0; padding:5px 14px; border-top:1px solid #15171d;
            display:flex; align-items:center; gap:12px; }
  #status .sp { flex:1; }
  .linkbtn { background:none; border:0; color:#8b90a0; font-size:12px; cursor:pointer;
             text-decoration:underline; padding:0; }
  .linkbtn:hover { color:#e7e9ee; background:none; }

  /* --- panneau stats --- */
  #statsPanel { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex;
                align-items:center; justify-content:center; z-index:50; }
  .sp-inner { background:#0e1015; border:1px solid #262a33; border-radius:12px;
              width:min(640px,92vw); max-height:88vh; overflow-y:auto; padding:20px; }
  .sp-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  #statsBody h4 { margin:18px 0 8px; font-size:13px; color:#9aa0b0; }
  .kpis { display:flex; flex-wrap:wrap; gap:10px; }
  .kpi { flex:1; min-width:96px; background:#12141a; border:1px solid #1e2128;
         border-radius:8px; padding:10px 12px; text-align:center; }
  .kpi .v { font-size:20px; font-weight:700; }
  .kpi .l { font-size:11px; color:#8b90a0; margin-top:2px; }
  .chart { display:flex; align-items:flex-end; gap:4px; height:120px; padding-top:6px; }
  .chart .bar { flex:1; display:flex; flex-direction:column; align-items:center;
                justify-content:flex-end; height:100%; }
  .chart .fill { width:100%; background:#5865F2; border-radius:3px 3px 0 0; min-height:2px; }
  .chart .bl { font-size:9px; color:#6b7080; margin-top:3px; }
  .srow { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:13px; }
  .srow .sl { width:130px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .srow .sbar { flex:1; background:#12141a; border-radius:5px; height:14px; overflow:hidden; }
  .srow .sbar > span { display:block; height:100%; background:#3a7d3a; }
  .srow .sv { width:32px; text-align:right; color:#9aa0b0; }
  .muted { color:#6b7080; font-size:13px; }

  .hidden { display:none !important; }
  .placeholder { margin:auto; color:#6b7080; }
</style>
</head>
<body>
  <div id="login">
    <h1>Yuza Support</h1>
    <p id="loginMsg">Connecte-toi avec Discord pour accéder aux tickets.</p>
    <a id="loginBtn" class="btn" href="/auth/login">Se connecter avec Discord</a>
  </div>

  <div id="app">
    <div id="sidebar">
      <div id="sbHead">
        <input id="search" type="search" placeholder="Rechercher (nom, message, ID)…" autocomplete="off" />
        <div id="filters">
          <button data-f="open" class="active">Ouverts</button>
          <button data-f="closed">Clôturés</button>
          <button data-f="all">Tous</button>
        </div>
      </div>
      <div id="ticketList"><div class="empty">Aucun ticket pour l'instant.</div></div>
    </div>
    <div id="main">
      <div id="head">
        <strong id="headName">—</strong>
        <span id="headWho" class="who"></span>
        <span id="headAssignee"></span>
        <span class="sp"></span>
        <button id="blockBtn" class="hidden" title="Empêcher ce client d'ouvrir des tickets">🚫 Bloquer</button>
        <button id="takeBtn" class="hidden">Prendre</button>
        <select id="escSelect" class="hidden" title="Niveau du ticket / escalade"></select>
        <select id="catSelect" class="hidden" title="Catégorie du ticket"></select>
        <button id="closeBtn" class="hidden">Clôturer</button>
        <button id="reopenBtn" class="hidden">Rouvrir</button>
      </div>
      <div id="msgs"><div class="placeholder">Sélectionne un ticket à gauche.</div></div>
      <div id="composer">
        <label id="noteToggle" title="Visible staff uniquement — n'est pas envoyée au client">
          <input type="checkbox" id="noteCheck" /> Note interne
        </label>
        <button id="attachBtn" title="Envoyer un fichier au client">📎</button>
        <input type="file" id="fileInput" class="hidden" />
        <input id="input" placeholder="Écris ta réponse au client…" autocomplete="off" disabled />
        <button id="sendBtn" disabled>Envoyer</button>
      </div>
    </div>
  </div>

  <div id="status">
    <span id="statusText">chargement…</span>
    <span class="sp"></span>
    <button id="statsBtn" class="linkbtn hidden">📊 Stats</button>
    <button id="notifBtn" class="linkbtn hidden">🔔 Activer les notifications</button>
    <a id="logoutBtn" class="linkbtn hidden" href="/auth/logout">Se déconnecter</a>
  </div>

  <div id="statsPanel" class="hidden">
    <div class="sp-inner">
      <div class="sp-head">
        <strong>Statistiques</strong>
        <button id="statsClose" class="linkbtn">Fermer ✕</button>
      </div>
      <div id="statsBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
